<!DOCTYPE html>
<html lang="en">

  <title>Melo — Your Library</title>
  <link rel="stylesheet" href="../css/base.css" />

</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1 class="logo">Melo</h1>
      <nav>
        <a href="../index.html">Home</a>
        <a href="search.html">Search</a>
